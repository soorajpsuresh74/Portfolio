services:
  # React portfolio (Vite) — repo root
  - type: web
    name: portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_VERSION
        value: "22.16.0"

      - key: BASE_PATH
        value: /

  # Strapi CMS — ./cms, backed by Neon Postgres
  - type: web
    name: strapi-cms
    runtime: node
    plan: free
    region: oregon
    rootDir: cms

    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start

    healthCheckPath: /_health

    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: NODE_VERSION
        value: "22.16.0"

      - key: DATABASE_CLIENT
        value: postgres

      # Neon connection string, set in the Render dashboard:
      # postgresql://<user>:<password>@<endpoint>.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      - key: DATABASE_SSL
        value: "true"

      # Neon suspends idle computes; don't hold connections open
      - key: DATABASE_POOL_MIN
        value: "0"

      - key: APP_KEYS
        generateValue: true

      - key: API_TOKEN_SALT
        generateValue: true

      - key: ADMIN_JWT_SECRET
        generateValue: true

      - key: TRANSFER_TOKEN_SALT
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: ENCRYPTION_KEY
        generateValue: true
