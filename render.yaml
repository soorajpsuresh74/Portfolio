
services:
  - type: web
    name: strapi-cms
    runtime: node
    plan: free
    region: oregon

    buildCommand: |
      node -e "const p=require('./package.json'); if (!p.dependencies?.['@strapi/strapi'] && !p.devDependencies?.['@strapi/strapi']) { console.error('ERROR: This repository does not contain Strapi. Connect your Strapi backend repository, not your Vite Portfolio repository.'); process.exit(1); }"
      npm ci
      npm run build

    startCommand: npm run start

    healthCheckPath: /_health

    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: NODE_VERSION
        value: "22.16.0"

      - key: DATABASE_CLIENT
        value: postgres

      - key: DATABASE_URL
        sync: false

      - key: APP_KEYS
        generateValue: true

      - key: API_TOKEN_SALT
        generateValue: true

      - key: ADMIN_JWT_SECRET
        generateValue: true

      - key: TRANSFER_TOKEN_SALT
        generateValue: true

      - key: JWT_SECRET
        generateValue: true
