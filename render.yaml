services:
  # Strapi CMS — ./cms, backed by Neon Postgres
  - type: web
    name: strapi-cms
    runtime: node
    plan: free
    region: oregon
    rootDir: cms

    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start

    healthCheckPath: /_health

    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: NODE_VERSION
        value: "22.16.0"

      - key: STRAPI_TELEMETRY_DISABLED
        value: "true"

      # Portfolio origin(s) allowed to call the API, comma-separated,
      # e.g. https://soorajpsuresh74.github.io
      - key: CORS_ORIGINS
        sync: false

      # Super admin created on first start, before the server accepts requests.
      # Password: 8+ chars with upper, lower and a digit. Remove after first login.
      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: DATABASE_CLIENT
        value: postgres

      # Neon connection string, set in the Render dashboard:
      # postgresql://<user>:<password>@<endpoint>.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      - key: DATABASE_SSL
        value: "true"

      # Neon suspends idle computes; don't hold connections open
      - key: DATABASE_POOL_MIN
        value: "0"

      - key: APP_KEYS
        generateValue: true

      - key: API_TOKEN_SALT
        generateValue: true

      - key: ADMIN_JWT_SECRET
        generateValue: true

      - key: TRANSFER_TOKEN_SALT
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: ENCRYPTION_KEY
        generateValue: true
