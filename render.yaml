
services:
  - type: web
    name: strapi-cms
    runtime: node
    plan: free
    region: oregon

    buildCommand: npm ci && npm run build
    startCommand: npm run start

    healthCheckPath: /_health

    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: NODE_VERSION
        value: "22.16.0"

      # Database credentials are configured privately in Render.
      - key: DATABASE_CLIENT
        value: postgres

      - key: DATABASE_URL
        sync: false

      # Generate secrets in Render
      - key: APP_KEYS
        generateValue: true

      - key: API_TOKEN_SALT
        generateValue: true

      - key: ADMIN_JWT_SECRET
        generateValue: true

      - key: TRANSFER_TOKEN_SALT
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: ENCRYPTION_KEY
        generateValue: true
