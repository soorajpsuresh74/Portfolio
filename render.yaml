services:
  # React portfolio (Vite) — repo root
  - type: web
    name: portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains

    envVars:
      - key: NODE_VERSION
        value: "22.16.0"

      - key: BASE_PATH
        value: /

      # Public URL of the strapi-cms service, e.g. https://strapi-cms.onrender.com
      - key: VITE_STRAPI_URL
        sync: false

  # Strapi CMS — ./cms, backed by Neon Postgres
  - type: web
    name: strapi-cms
    runtime: node
    plan: free
    region: oregon
    rootDir: cms

    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start

    healthCheckPath: /_health

    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: NODE_VERSION
        value: "22.16.0"

      - key: STRAPI_TELEMETRY_DISABLED
        value: "true"

      # This service's own public URL, e.g. https://strapi-cms.onrender.com
      - key: PUBLIC_URL
        sync: false

      # Portfolio origin(s) allowed to call the API, comma-separated,
      # e.g. https://portfolio.onrender.com
      - key: CORS_ORIGINS
        sync: false

      # Super admin created on first start, before the server accepts requests.
      # Password: 8+ chars with upper, lower and a digit. Remove after first login.
      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: DATABASE_CLIENT
        value: postgres

      # Neon connection string, set in the Render dashboard:
      # postgresql://<user>:<password>@<endpoint>.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      - key: DATABASE_SSL
        value: "true"

      # Neon suspends idle computes; don't hold connections open
      - key: DATABASE_POOL_MIN
        value: "0"

      - key: APP_KEYS
        generateValue: true

      - key: API_TOKEN_SALT
        generateValue: true

      - key: ADMIN_JWT_SECRET
        generateValue: true

      - key: TRANSFER_TOKEN_SALT
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: ENCRYPTION_KEY
        generateValue: true
